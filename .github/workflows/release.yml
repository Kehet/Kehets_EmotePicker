name: Release AddOn # description of this workflow, can be anything you want

# release-please keeps a release PR open on master; merging it tags the release and packages it
on:
  push:
    branches:
      - master

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and GitHub release
      pull-requests: write # open and update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  # Runs here instead of on tag push: tags created with GITHUB_TOKEN do not trigger other workflows
  package:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the zip to the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0 # packager reads the version from the tag
          persist-credentials: false

      - name: Install Subversion # the Ace3 externals are svn repositories
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq subversion

      # The packager action skips a tagged commit on a branch push, expecting a tag push to build it.
      # GITHUB_REF cannot be overridden in step env, so run release.sh with the tag ref directly.
      - name: Package and upload
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          PACKAGER_SHA: e50a250f8705041e40f2fa1ddcb280a686d65aa0 # BigWigsMods/packager v2.6.1
        run: |
          curl -fsSL "https://raw.githubusercontent.com/BigWigsMods/packager/${PACKAGER_SHA}/release.sh" -o "$RUNNER_TEMP/release.sh"
          GITHUB_REF="refs/tags/${TAG_NAME}" GITHUB_REF_NAME="${TAG_NAME}" bash "$RUNNER_TEMP/release.sh"
