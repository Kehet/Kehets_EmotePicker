name: Release AddOn # description of this workflow, can be anything you want

# release-please keeps a release PR open on master; merging it tags the release and packages it
on:
  push:
    branches:
      - master

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and GitHub release
      pull-requests: write # open and update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  # Tags created with GITHUB_TOKEN do not trigger other workflows, but workflow_dispatch does.
  # Running package.yml on the tag ref lets the packager action build it as a tag release.
  package:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write # dispatch package.yml
    steps:
      - name: Dispatch package workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh workflow run package.yml --ref "$TAG_NAME"
